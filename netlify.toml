# Netlify Configuration File for Next.js App (Subdirectory: frontend)

[build]
  # Specify the base directory where frontend package.json lives
  base = "frontend"
  # Build command
  command = "npm run build"
  # Next.js publish directory
  publish = ".next"

# Essential Next.js Plugin for Netlify App Router support
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Skip slow post-processing (Next.js handles JS/CSS bundling natively)
[build.processing]
  skip_processing = true

[build.processing.css]
  bundle = false
  minify = false

[build.processing.js]
  bundle = false
  minify = false

[build.processing.html]
  pretty_urls = false

